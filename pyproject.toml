[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--cov=custom_components.acwd",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]
markers = [
    "unit: unit tests (no network, no HA core)",
    "integration: integration tests requiring HA fixtures",
    "slow: tests that take significant time",
    "timezone: tests for timezone-sensitive logic",
]

# Kept out of requirements-test.txt so CI never installs it. Major capped because
# mutmut 4 could change the [tool.mutmut] format without failing loudly.
[dependency-groups]
mutation = ["mutmut>=3.7,<4"]

# Mutation testing, run by hand. --no-cov skips coverage collection and the HTML
# report on every mutant run.
[tool.mutmut]
source_paths = ["custom_components/"]
also_copy = ["tests/", "pyproject.toml"]
# Mutated log calls test nothing but log text. Delete mutants/ after changing this.
do_not_mutate_patterns = ['_LOGGER\.']
# A mutant that breaks a loop can eat enough memory to hang WSL at the default of 15.
timeout_multiplier = 5.0
# Vale edits would otherwise count as a dependency change and discard the cache.
cache_invalidation_exclude = [".vale.ini", ".vale/*"]
# "warn" can keep a stale cache that skips every mutant as uncovered.
on_dependency_change = "rerun"
pytest_add_cli_args = ["--no-cov"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.ruff]
target-version = "py314"
line-length = 130
extend-exclude = [
    ".claude",
    ".planning",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "G",    # flake8-logging-format
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.acwd"]
